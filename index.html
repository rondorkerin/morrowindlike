<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morrowind-style Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #ui {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #222;
        font-family: 'Georgia', serif;
        font-size: 14px;
        text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        background: rgba(255,255,255,0.7);
        padding: 8px 12px;
        border-radius: 4px;
        pointer-events: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        background: rgba(255,255,255,0.5);
        border-radius: 50%;
        pointer-events: none;
      }
      #instructions {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #222;
        font-family: 'Georgia', serif;
        font-size: 18px;
        text-align: center;
        background: rgba(255,255,255,0.9);
        padding: 20px 30px;
        border-radius: 8px;
        cursor: pointer;
      }
      #instructions.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="ui">
      WASD - Move | Mouse - Look | Shift - Run | Space - Jump | V - Toggle View | LMB - Attack
    </div>
    <div id="crosshair"></div>
    <div id="instructions">Click to explore the world</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
